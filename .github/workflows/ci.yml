name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No GEMINI_API_KEY / RUN_LIVE_GEMINI here on purpose:
      # live Gemini tests are skipped, so CI runs without any secret.
      - name: Run pytest
        run: python -m pytest -q
